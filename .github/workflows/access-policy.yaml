name: Check application access policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: homelab-runners
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/python-tool-cache
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Reject missing application group restrictions
        run: |
          python3 -m venv "$RUNNER_TEMP/access-policy-venv"
          "$RUNNER_TEMP/access-policy-venv/bin/pip" install -r scripts/requirements-access-tests.txt
          PATH="$RUNNER_TEMP/access-policy-venv/bin:$PATH" scripts/test access-policy
