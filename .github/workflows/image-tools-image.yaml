name: Build Homelab image-tools MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/image-tools-image.yaml
      - config/image-tools/**

permissions:
  contents: read
  packages: write

concurrency:
  group: homelab-image-tools
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alpar-t/homelab-image-tools

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: config/image-tools/package-lock.json

      - name: Test image tools
        working-directory: config/image-tools
        run: npm ci && npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: config/image-tools
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
