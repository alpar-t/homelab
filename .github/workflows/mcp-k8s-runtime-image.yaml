name: Build Baloo Kubernetes MCP runtime image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mcp-k8s-runtime-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alpar-t/mcp-k8s-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: config/baloo/mcp-k8s-runtime
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Smoke test read-only MCP catalog without credentials
        run: |
          docker pull "$IMAGE:sha-${{ github.sha }}"
          docker run -d --name mcp-k8s-runtime-smoke \
            --read-only --tmpfs /tmp:rw,nosuid,size=32m \
            --user 1000:1000 \
            --env ENABLE_UNSAFE_STREAMABLE_HTTP_TRANSPORT=1 \
            --env HOST=127.0.0.1 --env PORT=3000 \
            --env DNS_REBINDING_ALLOWED_HOST=127.0.0.1:3000 \
            --env ALLOW_ONLY_READONLY_TOOLS=true \
            --mount "type=bind,source=$PWD/config/baloo/mcp-k8s-runtime/smoke.mjs,target=/smoke.mjs,readonly" \
            "$IMAGE:sha-${{ github.sha }}"
          trap 'docker rm -f mcp-k8s-runtime-smoke >/dev/null' EXIT
          docker exec mcp-k8s-runtime-smoke node /smoke.mjs
