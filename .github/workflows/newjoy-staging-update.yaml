name: Update Newjoy staging release
on:
  workflow_dispatch:
  schedule:
    - cron: '12,27,42,57 * * * *'
permissions:
  contents: write
concurrency:
  group: newjoy-staging-gitops
  cancel-in-progress: false
jobs:
  update:
    # Registry metadata + Git only. Website builds run on homelab ARC runners.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: Install registry inspector
        run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Test bounded staging updater
        run: python3 scripts/test-newjoy-staging.py
      - name: Resolve and record the latest published website release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-newjoy-staging.py
          target=config/newjoy-website-staging/manifests/deployment.yaml
          if git diff --quiet -- "$target"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'deploy(newjoy): update staging to verified release [skip ci]'
          # Refuse concurrent-main overwrites. The next scheduled run retries.
          git push origin HEAD:main
