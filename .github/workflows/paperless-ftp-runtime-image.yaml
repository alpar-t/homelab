name: Build Paperless FTP runtime image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/paperless-ftp-runtime-image.yaml
      - config/paperless-ngx/ftp-runtime/**

permissions:
  contents: read
  packages: write

concurrency:
  group: paperless-ftp-runtime-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alpar-t/paperless-ftp-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pure-pw login and passive upload
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: config/paperless-ngx/ftp-runtime
          target: smoke
          push: false
          platforms: linux/amd64

      - name: Build and publish immutable runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: config/paperless-ngx/ftp-runtime
          target: runtime
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
