name: Build Newjoy portal image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/portal-image.yaml
      - config/portal/image/**
      - config/portal/manifests/assets/**
      - config/portal/manifests/nginx/**

permissions:
  contents: write
  packages: write

concurrency:
  group: newjoy-portal-image
  cancel-in-progress: true

env:
  BASE_IMAGE: docker.io/library/nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
  CRANE_VERSION: v0.21.9
  CRANE_LINUX_X86_64_SHA256: 5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e
  IMAGE: ghcr.io/alpar-t/newjoy-portal

jobs:
  build:
    runs-on: homelab-runners
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate portal sources
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/runner/externals/node24/bin:$PATH"
          node --check config/portal/manifests/assets/app.js
          node --check config/portal/manifests/assets/theme.js
          for catalog in config/portal/manifests/assets/catalog/*.json; do
            jq empty "$catalog"
          done

      - name: Install verified crane release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go-containerregistry_Linux_x86_64.tar.gz"
          bin_dir="$RUNNER_TEMP/crane-bin"
          mkdir -p "$bin_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$CRANE_LINUX_X86_64_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" crane
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Assemble deterministic portal layer
        id: image
        shell: bash
        run: |
          set -euo pipefail
          rootfs="$RUNNER_TEMP/portal-rootfs"
          layer="$RUNNER_TEMP/portal-layer.tar"
          mkdir -p \
            "$rootfs/usr/share/nginx/html" \
            "$rootfs/etc/nginx/conf.d"
          cp -R config/portal/manifests/assets/. "$rootfs/usr/share/nginx/html/"
          cp config/portal/manifests/nginx/default.conf "$rootfs/etc/nginx/conf.d/default.conf"
          find "$rootfs" -exec touch -h -d '@0' {} +
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf "$layer" \
            -C "$rootfs" .
          printf 'layer=%s\n' "$layer" >> "$GITHUB_OUTPUT"

      - name: Publish private GHCR image
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          tagged_ref="${IMAGE}:${tag}"
          printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          crane append \
            --platform linux/amd64 \
            --base "$BASE_IMAGE" \
            --new_layer "${{ steps.image.outputs.layer }}" \
            --new_tag "$tagged_ref"
          digest="$(crane digest --platform linux/amd64 "$tagged_ref")"
          crane manifest --platform linux/amd64 "${tagged_ref}@${digest}" >/dev/null
          printf 'ref=%s@%s\n' "$tagged_ref" "$digest" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Promote the verified image digest
        shell: bash
        env:
          PORTAL_IMAGE: ${{ steps.publish.outputs.ref }}
          PORTAL_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- \
            .github/workflows/portal-image.yaml \
            config/portal/image \
            config/portal/manifests/assets \
            config/portal/manifests/nginx; then
            echo "A newer portal source commit exists; its workflow run will promote the replacement image."
            exit 0
          fi
          git rebase origin/main
          escaped_image="${PORTAL_IMAGE//&/\\&}"
          sed "s|__PORTAL_IMAGE__|${escaped_image}|" \
            config/portal/image/deployment.yaml.template \
            > config/portal/manifests/deployment.yaml
          cp \
            config/portal/image/kustomization.yaml.template \
            config/portal/manifests/kustomization.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            config/portal/manifests/deployment.yaml \
            config/portal/manifests/kustomization.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy portal image ${PORTAL_TAG} [skip ci]"
          git push origin HEAD:main
