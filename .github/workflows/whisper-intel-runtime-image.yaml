name: Build Whisper Intel runtime image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: whisper-intel-runtime-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alpar-t/wyoming-whisper-intel-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: config/baloo/whisper-intel-runtime
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
