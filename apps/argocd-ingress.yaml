apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alpar-t/homelab
    targetRevision: main
    path: config/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # This Application intentionally renders no resources. Allow the empty
      # target so ArgoCD prunes the former public Ingress instead of treating
      # its removal as an error.
      allowEmpty: true
      prune: true
      selfHeal: true
