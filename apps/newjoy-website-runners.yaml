apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: newjoy-website-runners
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.14.2
      helm:
        releaseName: newjoy-website-runners
        valueFiles:
          - $values/config/actions-runner-controller/newjoy-website-runner-values.yaml
    - repoURL: https://github.com/alpar-t/homelab
      targetRevision: main
      ref: values
    - repoURL: https://github.com/alpar-t/homelab
      targetRevision: main
      path: config/newjoy-website-build/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
