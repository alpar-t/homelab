# Transitional cleanup application. The live Sure Application has no resource
# finalizer, so deleting it directly would orphan its namespace, Ingress, and
# PVCs. Pointing the existing Application at an intentionally empty directory
# lets its own prune policy remove those resources first. Delete this file and
# config/sure-cleanup after Argo reports the application Synced/Healthy with no
# managed resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/alpar-t/homelab
    targetRevision: main
    path: config/sure-cleanup
  destination:
    server: https://kubernetes.default.svc
    namespace: sure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
