githubConfigUrl: https://github.com/alpar-t/newjoy-website
githubConfigSecret: github-arc-token

runnerScaleSetName: newjoy-website-runners
minRunners: 0
maxRunners: 1

controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller

listenerTemplate:
  spec:
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: listener
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}

template:
  spec:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.1@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690
        command: [/home/runner/run.sh]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 2Gi}
          limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 10Gi}
        volumeMounts:
          - {name: work, mountPath: /home/runner/_work}
          - {name: tool-cache, mountPath: /opt/hostedtoolcache}
          - {name: build-storage, mountPath: /newjoy-build}
          - {name: opencloud, mountPath: /var/run/newjoy-opencloud, readOnly: true}
    volumes:
      - name: work
        emptyDir: {sizeLimit: 8Gi}
      - name: tool-cache
        emptyDir: {sizeLimit: 1Gi}
      - name: build-storage
        persistentVolumeClaim: {claimName: newjoy-website-build}
      - name: opencloud
        secret: {secretName: newjoy-website-opencloud, defaultMode: 0440}
