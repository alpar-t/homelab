apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-budget-data
  namespace: actual-budget
  labels:
    app.kubernetes.io/name: actual-budget
    data-criticality: critical
    recurring-job-group.longhorn.io/critical: enabled
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-budget-mcp-cache
  namespace: actual-budget
  labels:
    app.kubernetes.io/name: actual-budget-mcp
    data-criticality: rebuildable
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd-noreplica
  resources:
    requests:
      storage: 1Gi
