apiVersion: v1
kind: Service
metadata:
  name: actual-budget
  namespace: actual-budget
  labels:
    app.kubernetes.io/name: actual-budget
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: actual-budget
  ports:
    - name: http
      port: 5006
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: actual-budget-mcp
  namespace: actual-budget
  labels:
    app.kubernetes.io/name: actual-budget-mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: actual-budget-mcp
  ports:
    - name: mcp
      port: 3000
      targetPort: mcp
