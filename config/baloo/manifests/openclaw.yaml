# OpenClaw gateway with a private configuration repo supplied by git-sync.
#
# git-sync authenticates to the private alpar-t/baloo repo with the same
# GitHub App Baloo uses for reviewed repository changes. It clones into an
# emptyDir at /git; OpenClaw reads config and workspaces from /git/link/openclaw/.
# Writable state (WA session auth, credentials) lives on the Longhorn PVC at /state.
#
# Config changes (SOUL.md, AGENTS.md) propagate on the next conversation without restart.
# openclaw.json changes (bindings, tool policies) require a new pod — the render-config
# init container bakes the config at startup and CrashLoopBackOff restarts don't re-run it.
#   kubectl rollout restart deployment/openclaw -n baloo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: baloo
  labels:
    app.kubernetes.io/name: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
      annotations:
        homelab/config-rev: "2026-08-13h"
        secret.reloader.stakater.com/reload: "vikunja-baloo-token,opencloud-baloo,olx-baloo,court-case-baloo"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # One-shot clone so the repo is on disk before render-config runs.
        - name: git-sync-init
          image: registry.k8s.io/git-sync/git-sync:v4.7.0@sha256:d232fd13474ba1b46dba431af2b1411b9d9afacda55ae644d2a32e43975128dd
          args:
            - --repo=https://github.com/alpar-t/baloo.git
            - --root=/git
            - --link=link
            - --depth=1
            - --github-app-application-id=4150403
            - --github-app-installation-id=142711366
            - --github-app-private-key-file=/var/run/secrets/github-app/private-key.pem
            - --one-time
          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: git-repo
              mountPath: /git
            - name: tmp
              mountPath: /tmp
            - name: github-app-key
              mountPath: /var/run/secrets/github-app
              readOnly: true
        # Substitute ${BALOO_OWNER_PHONE} into openclaw.json → /rendered/openclaw.json
        - name: render-config
          image: ghcr.io/openclaw/openclaw:2026.7.1-2@sha256:8789721d2e9b24b780a1504b56deb4c6bd5c7dbf96a1dd117e7c45c2ed72c8ac
          command:
            - node
            - -e
            - |
              const fs = require('fs');
              const src = fs.readFileSync('/git/link/openclaw/openclaw.json', 'utf8');
              const out = src.replace(/\$\{([^}]+)\}/g, (_, k) => process.env[k] ?? _);
              fs.writeFileSync('/rendered/openclaw.json', out);
          env:
            - name: BALOO_OWNER_PHONE
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: BALOO_OWNER_PHONE
            - name: KINGA_PHONE
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: KINGA_PHONE
            - name: BALOO_SHEF_GROUP
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: BALOO_SHEF_GROUP
            - name: BALOO_GARDEN_GROUP
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: BALOO_GARDEN_GROUP
            - name: BALOO_TRIPS_PALKOEK_GROUP
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: BALOO_TRIPS_PALKOEK_GROUP
                  optional: true
            # The historical Secret key name says READONLY, but the HA user is
            # control-capable. Expose an accurately named render variable.
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: HA_TOKEN_READONLY
            - name: TREK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: TREK_CLIENT_ID
            - name: TREK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: TREK_CLIENT_SECRET
            - name: ACTUAL_MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: ACTUAL_MCP_API_KEY
            # CDP token for the isolated browser pod (config/baloo/manifests/browser.yaml).
            # Optional so the pod still renders before the secret key is created.
            - name: BROWSER_CDP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: BROWSER_CDP_TOKEN
                  optional: true
            # Dedicated, non-admin OpenCloud account. Keep these optional while
            # staging: creating the Secret triggers Reloader and makes the
            # read-only Newjoy WebDAV MCP available without a broken rollout.
            - name: OPENCLOUD_WEBDAV_URL
              valueFrom:
                secretKeyRef:
                  name: opencloud-baloo
                  key: webdav-url
                  optional: true
            - name: OPENCLOUD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opencloud-baloo
                  key: username
                  optional: true
            - name: OPENCLOUD_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencloud-baloo
                  key: app-token
                  optional: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: git-repo
              mountPath: /git
              readOnly: true
            - name: rendered
              mountPath: /rendered
        # Keep state-installed plugins (whatsapp, browser) in lockstep with the
        # pinned core image. Plugins live in the /state PVC and are installed
        # once, so a core image bump leaves them stale — that drift shipped a
        # whatsapp plugin without inbound location parsing (2026-07-06). This
        # resolves each tracked plugin to the ClawHub version compatible with
        # the running core. Non-fatal: if ClawHub is unreachable at boot we keep
        # the last-good plugin already on the PVC rather than crash-looping.
        - name: plugin-sync
          image: ghcr.io/openclaw/openclaw:2026.7.1-2@sha256:8789721d2e9b24b780a1504b56deb4c6bd5c7dbf96a1dd117e7c45c2ed72c8ac
          command:
            - sh
            - -c
            - node /app/dist/index.js plugins update --all || true
          env:
            - name: HOME
              value: /state/home
            - name: OPENCLAW_STATE_DIR
              value: /state
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
      containers:
        # Continuous sync sidecar — keeps /git/link up to date with main.
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.0@sha256:d232fd13474ba1b46dba431af2b1411b9d9afacda55ae644d2a32e43975128dd
          args:
            - --repo=https://github.com/alpar-t/baloo.git
            - --root=/git
            - --link=link
            - --depth=1
            - --period=60s
            - --github-app-application-id=4150403
            - --github-app-installation-id=142711366
            - --github-app-private-key-file=/var/run/secrets/github-app/private-key.pem
          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: git-repo
              mountPath: /git
            - name: tmp
              mountPath: /tmp
            - name: github-app-key
              mountPath: /var/run/secrets/github-app
              readOnly: true

        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.7.1-2@sha256:8789721d2e9b24b780a1504b56deb4c6bd5c7dbf96a1dd117e7c45c2ed72c8ac
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/dist/index.js
            - gateway
            - run
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          env:
            - name: HOME
              value: /state/home
            - name: NODE_ENV
              value: production
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: OPENCLAW_CONFIG_PATH
              value: /rendered/openclaw.json
            - name: OPENCLAW_STATE_DIR
              value: /state
            # Enables the loopback-only browser control API used by the OLX
            # credential helper. It remains protected by the gateway token.
            - name: OPENCLAW_EAGER_BROWSER_CONTROL_SERVER
              value: "1"
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: ANTHROPIC_API_KEY
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: GOOGLE_MAPS_API_KEY
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: baloo-github-app
                  key: app-id
            - name: GITHUB_APP_INSTALLATION_ID
              value: "142711366"
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/healthz', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/readyz', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: git-repo
              mountPath: /git
              readOnly: true
            - name: rendered
              mountPath: /rendered
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
            - name: github-app-key
              mountPath: /var/run/secrets/github-app
              readOnly: true

        # Credential-isolating OLX login helper. Only this sidecar receives the
        # account email/password; the LLM-facing tool returns status + tab id.
        # All subsequent OLX navigation uses OpenClaw's ordinary browser tool.
        - name: olx-auth-mcp
          image: ghcr.io/openclaw/openclaw:2026.7.1-2@sha256:8789721d2e9b24b780a1504b56deb4c6bd5c7dbf96a1dd117e7c45c2ed72c8ac
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /git/link/openclaw/tools/olx-auth-mcp.js
          ports:
            - name: olx-auth-mcp
              containerPort: 18803
              protocol: TCP
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: OLX_EMAIL
              valueFrom:
                secretKeyRef:
                  name: olx-baloo
                  key: email
                  optional: true
            - name: OLX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: olx-baloo
                  key: password
                  optional: true
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18803/health', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18803/health', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: git-repo
              mountPath: /git
              readOnly: true
            - name: tmp
              mountPath: /tmp

        # Court credential + durable document-state boundary. The password is
        # never rendered into OpenClaw config or exposed in an agent tool result.
        - name: court-case-mcp
          image: ghcr.io/openclaw/openclaw:2026.7.1-2@sha256:8789721d2e9b24b780a1504b56deb4c6bd5c7dbf96a1dd117e7c45c2ed72c8ac
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /git/link/openclaw/tools/court-case-mcp.js
          ports:
            - name: court-case-mcp
              containerPort: 18804
              protocol: TCP
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: COURT_CASE_DOCUMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: court-case-baloo
                  key: document-password
            - name: COURT_CASE_STATE_DIR
              value: /state/court-case
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18804/health', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18804/health', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: git-repo
              mountPath: /git
              readOnly: true
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp

        # Agent-facing task tools. The bot token exists only in this sidecar;
        # the OpenClaw gateway reaches its curated MCP surface over localhost.
        - name: vikunja-mcp
          image: ghcr.io/openclaw/openclaw:2026.7.1-2@sha256:8789721d2e9b24b780a1504b56deb4c6bd5c7dbf96a1dd117e7c45c2ed72c8ac
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /git/link/openclaw/tools/vikunja-mcp.js
          ports:
            - name: tasks-mcp
              containerPort: 18802
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: VIKUNJA_API_URL
              value: http://vikunja.vikunja.svc.cluster.local/api/v2
            - name: VIKUNJA_DEFAULT_PROJECT
              value: Household Inbox
            - name: VIKUNJA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vikunja-baloo-token
                  key: token
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18802/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18802/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: git-repo
              mountPath: /git
              readOnly: true
            - name: tmp
              mountPath: /tmp

        # OpenAI-compatible synchronous image API for clients such as Open
        # WebUI. The agent still decides when to call generate_image/edit_image;
        # this sidecar only adapts those client tool calls to OpenClaw's image
        # provider CLI so results return to the originating HTTP chat.
        - name: image-api
          image: ghcr.io/openclaw/openclaw:2026.7.1-2@sha256:8789721d2e9b24b780a1504b56deb4c6bd5c7dbf96a1dd117e7c45c2ed72c8ac
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /git/link/openclaw/tools/openclaw-image-api.js
          ports:
            - name: image-api
              containerPort: 18801
              protocol: TCP
          env:
            - name: HOME
              value: /state/home
            - name: NODE_ENV
              value: production
            - name: OPENCLAW_CONFIG_PATH
              value: /rendered/openclaw.json
            - name: OPENCLAW_STATE_DIR
              value: /state
            - name: OPENCLAW_IMAGE_MODEL
              value: openai/gpt-image-2
            - name: OPENCLAW_IMAGE_TIMEOUT_MS
              value: "180000"
            - name: IMAGE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
          livenessProbe:
            httpGet:
              path: /health
              port: image-api
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: image-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: git-repo
              mountPath: /git
              readOnly: true
            - name: rendered
              mountPath: /rendered
              readOnly: true
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp

        # Reconcile recurring OpenClaw cron jobs from git without touching
        # one-shot reminders created by users in chat.
        - name: cron-sync
          image: ghcr.io/openclaw/openclaw:2026.7.1-2@sha256:8789721d2e9b24b780a1504b56deb4c6bd5c7dbf96a1dd117e7c45c2ed72c8ac
          command:
            - node
            - /git/link/openclaw/tools/sync-cron-jobs.js
            - /git/link/openclaw/cron-jobs.json
          env:
            - name: HOME
              # The CLI device identity must survive pod restarts; otherwise
              # every cron reconciliation requests a fresh operator pairing.
              value: /state/cron-sync-home
            - name: OPENCLAW_CONFIG_PATH
              value: /rendered/openclaw.json
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: BALOO_OWNER_PHONE
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: BALOO_OWNER_PHONE
            - name: BALOO_TRIPS_PALKOEK_GROUP
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: BALOO_TRIPS_PALKOEK_GROUP
                  optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: git-repo
              mountPath: /git
              readOnly: true
            - name: rendered
              mountPath: /rendered
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /state

      volumes:
        - name: git-repo
          emptyDir: {}
        - name: rendered
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: openclaw-state
        - name: tmp
          emptyDir: {}
        - name: github-app-key
          secret:
            secretName: baloo-github-app
            items:
              - key: private-key
                path: private-key.pem
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: baloo
  labels:
    app.kubernetes.io/name: openclaw
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw
  ports:
    - name: gateway
      port: 18789
      targetPort: 18789
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-image-api
  namespace: baloo
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: image-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw
  ports:
    - name: image-api
      port: 18801
      targetPort: image-api
