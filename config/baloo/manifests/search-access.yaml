# Public browser access requires Pocket ID; Baloo retains its internal Service.
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-search
  namespace: baloo
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy-search
  ports:
  - name: http
    port: 4180
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-search
  namespace: baloo
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: oauth2-proxy-search
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
        args:
        - --http-address=0.0.0.0:4180
        - --reverse-proxy=true
        - --trusted-proxy-ip=10.42.0.0/16
        - --upstream=static://200
        - --provider=oidc
        - --oidc-issuer-url=https://auth.newjoy.ro
        - --skip-oidc-discovery=true
        - --login-url=https://auth.newjoy.ro/authorize
        - --redeem-url=http://pocket-id.pocket-id.svc.cluster.local/api/oidc/token
        - --oidc-jwks-url=http://pocket-id.pocket-id.svc.cluster.local/.well-known/jwks.json
        - --scope=openid profile email groups
        - --oidc-groups-claim=groups
        - --allowed-group=advanced_apps
        - --allowed-group=family_users
        - --email-domain=*
        - --insecure-oidc-allow-unverified-email=true
        - --cookie-secure=true
        - --cookie-samesite=lax
        - --cookie-name=_newjoy_search
        - --cookie-domain=search.newjoy.ro
        - --redirect-url=https://search.newjoy.ro/oauth2/callback
        - --whitelist-domain=search.newjoy.ro
        - --skip-auth-route=^/ping$
        - --allowed-group=kids
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: searxng-search-oidc
              key: client_id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: searxng-search-oidc
              key: client_secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: searxng-search-cookie
              key: cookie_secret
        ports:
        - name: http
          containerPort: 4180
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 5
          periodSeconds: 30
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-oauth2-proxy
  namespace: baloo
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
spec:
  ingressClassName: nginx
  rules:
  - host: search.newjoy.ro
    http:
      paths:
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy-search
            port:
              number: 4180
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search
  namespace: baloo
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy-search.baloo.svc.cluster.local:4180/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://search.newjoy.ro/oauth2/start?rd=https://$host$escaped_request_uri
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
spec:
  ingressClassName: nginx
  rules:
  - host: search.newjoy.ro
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: searxng
            port:
              number: 8080
