# Frigate storage for disposable recordings. The bound Longhorn replica is
# deliberately isolated on pamacs's quarantined 3 TB disk; see
# runbooks/frigate-disposable-media-disk.md.
# Using HDD storage class with no replication.
#
# BACKUP EXCLUSION: This volume is excluded from Longhorn weekly backups.
# See config/longhorn/manifests/backup-exclusions.yaml

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-hdd-noreplica
  resources:
    requests:
      # Do not allocate the disk's full nominal capacity. 2Ti leaves Longhorn's
      # required free-space reserve plus working room for ext4 and snapshots.
      storage: 2Ti
---
# Config persistence (for Frigate database + model cache)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 10Gi
