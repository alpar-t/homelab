# Immich Machine Learning Service
# Handles: face detection, face recognition, CLIP smart search, OCR
#
# Keep one replica on the 32 GiB node when available. This leaves headroom
# for Longhorn and the workloads pinned to the 16 GiB nodes. Retain ordinal 2
# so its existing model-cache PVC remains attached.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-ml
  namespace: immich
  labels:
    app: immich-ml
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  ordinals:
    start: 2
  serviceName: immich-ml
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: immich-ml
  template:
    metadata:
      labels:
        app: immich-ml
    spec:
      affinity:
        # Keep this soft so ML can still run if Pamacs is unavailable.
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload/cpu-intensive
                    operator: In
                    values: ["true"]

      containers:
        - name: immich-ml
          # OpenVINO variant: ONNX inference runs on Intel iGPU instead of CPU.
          image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-openvino@sha256:627dfaf9339037be132209784883f7be13c1deb6be799454797bf6f231331f5b
          ports:
            - containerPort: 3003
              name: http
          env:
            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: "/cache"
            - name: MACHINE_LEARNING_CLIP_MODEL
              value: "ViT-B-32__openai"
            - name: MACHINE_LEARNING_FACIAL_RECOGNITION_MODEL
              value: "buffalo_l"
            # One worker per pod serializes inference on its iGPU.
            - name: MACHINE_LEARNING_WORKERS
              value: "1"
            - name: MACHINE_LEARNING_REQUEST_THREADS
              value: "4"

          volumeMounts:
            - name: model-cache
              mountPath: /cache

          resources:
            requests:
              cpu: 200m
              memory: 2560Mi
              gpu.intel.com/i915: 1
            limits:
              cpu: 2
              memory: 4Gi
              gpu.intel.com/i915: 1

          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5

  volumeClaimTemplates:
    - metadata:
        name: model-cache
        labels:
          app: immich
          data-criticality: rebuildable
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-ssd
        resources:
          requests:
            storage: 10Gi
---
# Immich ML Service
apiVersion: v1
kind: Service
metadata:
  name: immich-ml
  namespace: immich
  labels:
    app: immich-ml
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: immich-ml
  ports:
    - name: http
      port: 3003
      targetPort: 3003
      protocol: TCP

