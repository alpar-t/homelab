# Immich PostgreSQL Cluster
# Managed by CloudNativePG operator
#
# Credentials are auto-generated and stored in: immich-db-app secret
# Immich requires the VectorChord (vchord) extension for vector search.
# Migrated from pgvecto.rs (`vectors`) to VectorChord on 2026-07-27 for Immich v3,
# which dropped pgvecto.rs support.
#
# Backup Strategy:
# - CNPG continuous WAL archiving to Backblaze B2 (point-in-time recovery)
# - Daily base backups (photo metadata is critical)
# - 14-day retention
#
# Prerequisites:
#   kubectl create secret generic cnpg-backup-credentials \
#     --namespace=immich \
#     --from-literal=ACCESS_KEY_ID=<your-b2-key-id> \
#     --from-literal=SECRET_ACCESS_KEY=<your-b2-application-key>

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
  labels:
    app: immich
    # Photo library metadata - irreplaceable user data
    data-criticality: critical
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 2
  enablePDB: false
  
  # Use tensorchord/cloudnative-vectorchord image for vector extension support.
  # VectorChord (vchord) is Immich v3's required vector extension; it CASCADE-installs
  # pgvector, whose `vector` type lives in the public schema.
  imageName: docker.io/tensorchord/cloudnative-vectorchord:16.14-1.1.1@sha256:6ae813d01fc0592ae3b949fb4a678fa0023a4adb5459194db617d8ec468de9c2

  bootstrap:
    initdb:
      database: immich
      owner: immich
      # postInitTemplateSQL runs as postgres superuser on template1
      # Extensions installed here are copied to new databases
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance;
      # postInitApplicationSQL runs as superuser in the application database AFTER it's created
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance;
        - ALTER DATABASE immich SET search_path TO "$user", public;
  
  storage:
    # Grown from 10Gi → 20Gi on 2026-07-27: the pgvecto.rs→VectorChord migration's
    # table rewrites (WAL) plus vchord index rebuilds filled the 10Gi volume and
    # tripped CNPG's low-disk-space shutdown on the primary.
    size: 20Gi
    storageClass: longhorn-ssd

  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      # Increased to 2Gi to handle barman backup processes without OOM kills
      memory: "2Gi"
      cpu: "1000m"
  
  # Continuous backup to Backblaze B2
  backup:
    barmanObjectStore:
      destinationPath: "s3://homelab-longhorn-backup/cnpg/immich-db"
      endpointURL: "https://s3.eu-central-003.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
    retentionPolicy: "14d"
  
  postgresql:
    # shared_preload_libraries must be set via dedicated field, not parameters
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      log_statement: "ddl"
      shared_buffers: "256MB"
      max_connections: "100"
      # WAL archiving (required for CNPG backups)
      archive_mode: "on"
      archive_timeout: "1h"
      max_slot_wal_keep_size: "1GB"

