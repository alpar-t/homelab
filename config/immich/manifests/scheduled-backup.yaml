# Immich PostgreSQL Scheduled Backups
# Managed by CloudNativePG operator
#
# Daily base backups - photo metadata is critical and irreplaceable
# WAL archiving provides continuous protection between base backups

---
# Daily base backup at 05:15 UTC, after the 03:00-05:00 staggered Zincati
# maintenance windows. Immich backups take long enough to overlap a node reboot
# when started at 03:00, which caused repeat Wednesday failures.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-db-daily
  namespace: immich
  labels:
    app: immich
spec:
  # Daily at 05:15 UTC
  # CNPG requires 6-field cron (seconds prefix) — 5-field silently fires hourly.
  schedule: "0 15 5 * * *"
  
  # Which cluster to backup
  cluster:
    name: immich-db
  
  # Backup ownership - if cluster is deleted, backups are retained
  backupOwnerReference: none
  
  # Immediately trigger first backup when created
  immediate: true
