controller:
  # For Cloudflare Tunnel, we don't need external LoadBalancer
  service:
    type: ClusterIP
  
  # Get real client IPs from Cloudflare
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    use-proxy-protocol: "false"
    # Enable snippets for Authelia forward auth
    allow-snippet-annotations: "true"
    # Required since ingress-nginx v1.12+ annotation validation (IngressNightmare fix)
    # configuration-snippet is "Critical" risk; without this, ingresses using it are silently dropped
    annotations-risk-level: "Critical"
    # Trust X-Forwarded-Proto from Cloudflare Tunnel
    proxy-real-ip-cidr: "0.0.0.0/0"
  
  # Resource limits for homelab
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Keep one controller on each node. matchLabelKeys lets rolling-update surge
  # pods spread independently from the previous Deployment revision.
  replicaCount: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: controller
      matchLabelKeys:
        - pod-template-hash

  # Keep two ingress paths available during voluntary disruptions.
  minAvailable: 2

  # Allow scheduling on control plane nodes
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
