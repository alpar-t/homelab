apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: interior-designer-data
  namespace: baloo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: interior-designer-branding
  namespace: baloo
binaryData:
  favicon.ico: 
  favicon.png: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interior-designer
  namespace: baloo
  labels:
    app.kubernetes.io/name: interior-designer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: interior-designer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: interior-designer
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main@sha256:6a773e5c3a246b65cbe74ce942b294292c0e5f81c138f703d111bc162f7d7c3d
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WEBUI_URL
              value: https://baloo.newjoy.ro
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: interior-designer-webui
                  key: webui-secret-key
            # Keep this deployment as a UI. Do not load or download Open
            # WebUI's local SentenceTransformer/RAG models: all model work is
            # delegated to the existing OpenClaw gateway below.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: RAG_EMBEDDING_ENGINE
              value: openai
            - name: RAG_EMBEDDING_MODEL
              value: text-embedding-3-small
            - name: RAG_OPENAI_API_BASE_URL
              value: http://openclaw.baloo.svc.cluster.local:18789/v1
            - name: RAG_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: DEFAULT_USER_ROLE
              value: pending
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: interior-designer-oidc
                  key: client_id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: interior-designer-oidc
                  key: client_secret
            - name: OAUTH_PROVIDER_NAME
              value: Pocket ID
            - name: OPENID_PROVIDER_URL
              value: https://auth.newjoy.ro/.well-known/openid-configuration
            - name: OPENID_REDIRECT_URI
              value: https://baloo.newjoy.ro/oauth/oidc/callback
            - name: OAUTH_SCOPES
              value: openid email profile groups
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: ENABLE_OAUTH_GROUP_MANAGEMENT
              value: "true"
            - name: ENABLE_OAUTH_GROUP_CREATION
              value: "true"
            - name: OAUTH_ROLES_CLAIM
              value: groups
            - name: OAUTH_ALLOWED_ROLES
              value: family_users
            - name: OAUTH_ADMIN_ROLES
              value: advanced_apps
            # OpenClaw exposes agents as upstream OpenAI models. They have no
            # Open WebUI model records to attach per-group grants to, so the
            # default model ACL hides every agent from non-admin users.
            - name: BYPASS_MODEL_ACCESS_CONTROL
              value: "true"
            - name: OPENAI_API_BASE_URLS
              value: http://openclaw.baloo.svc.cluster.local:18789/v1
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: branding
              mountPath: /app/backend/open_webui/static/favicon.ico
              subPath: favicon.ico
              readOnly: true
            - name: branding
              mountPath: /app/backend/open_webui/static/favicon.png
              subPath: favicon.png
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: interior-designer-data
        - name: branding
          configMap:
            name: interior-designer-branding
---
apiVersion: v1
kind: Service
metadata:
  name: interior-designer
  namespace: baloo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: interior-designer
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interior-designer
  namespace: baloo
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: baloo.newjoy.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: interior-designer
                port:
                  number: 8080
