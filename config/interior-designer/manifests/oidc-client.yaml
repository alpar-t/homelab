# The Pocket ID client and its secret are created in-cluster so neither secret
# enters Git. The provisioner is defined by config/pocket-id/manifests/oidc-provisioner.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: interior-designer-oidc-client
  namespace: pocket-id
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: oidc-provisioner
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: ghcr.io/openclaw/openclaw:2026.6.11@sha256:ced693754e14ef5d66495db1d098f40fe07819b4b119b0f68de2a361fa83815b
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            - name: APP_NAME
              value: interior-designer
            - name: APP_URL
              value: https://baloo.newjoy.ro
            - name: CALLBACK_URL
              value: https://baloo.newjoy.ro/oauth/oidc/callback
            - name: TARGET_NS
              value: interior-designer
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: oidc-provisioner-script
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
