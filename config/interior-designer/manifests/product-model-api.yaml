apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-model-work
  namespace: baloo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-model-api
  namespace: baloo
  labels:
    app.kubernetes.io/name: product-model-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: product-model-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-model-api
      annotations:
        secret.reloader.stakater.com/reload: "opencloud-baloo,baloo-secrets"
        baloo.newjoy.ro/product-model-api-revision: "2026-10-01-keep-latest"
    spec:
      nodeSelector:
        workload/cpu-intensive: "true"
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: git-sync-init
          image: registry.k8s.io/git-sync/git-sync:v4.7.0@sha256:d232fd13474ba1b46dba431af2b1411b9d9afacda55ae644d2a32e43975128dd
          args:
            - --repo=https://github.com/alpar-t/baloo.git
            - --root=/git
            - --link=link
            - --depth=1
            - --github-app-application-id=4150403
            - --github-app-installation-id=142711366
            - --github-app-private-key-file=/var/run/secrets/github-app/private-key.pem
            - --one-time
          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: git-repo
              mountPath: /git
            - name: tmp
              mountPath: /tmp
            - name: github-app-key
              mountPath: /var/run/secrets/github-app
              readOnly: true
      containers:
        - name: product-model-api
          image: docker.io/blenderkit/headless-blender:blender-4.5@sha256:06cc9c5b70c81ac603d779a0415f3353131b9391d94f791240399cb3ef5d462c
          command: [python3, /git/link/openclaw/tools/product-model-api.py]
          ports:
            - name: http
              containerPort: 18810
          env:
            - name: PORT
              value: "18810"
            - name: PRODUCT_MODEL_WORK_ROOT
              value: /work/product-models
            - name: PRODUCT_MODEL_BUILD_TIMEOUT_SECONDS
              value: "900"
            - name: PRODUCT_MODEL_RUNNER_URL
              value: http://product-model-renderer.baloo.svc.cluster.local:18811
            - name: HOME
              value: /work
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PRODUCT_MODEL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: baloo-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: OPENCLOUD_WEBDAV_URL
              valueFrom:
                secretKeyRef:
                  name: opencloud-baloo
                  key: webdav-url
            - name: OPENCLOUD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opencloud-baloo
                  key: username
            - name: OPENCLOUD_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencloud-baloo
                  key: app-token
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: git-repo
              mountPath: /git
              readOnly: true
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.0@sha256:d232fd13474ba1b46dba431af2b1411b9d9afacda55ae644d2a32e43975128dd
          args:
            - --repo=https://github.com/alpar-t/baloo.git
            - --root=/git
            - --link=link
            - --depth=1
            - --period=60s
            - --github-app-application-id=4150403
            - --github-app-installation-id=142711366
            - --github-app-private-key-file=/var/run/secrets/github-app/private-key.pem
          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: git-repo
              mountPath: /git
            - name: tmp
              mountPath: /tmp
            - name: github-app-key
              mountPath: /var/run/secrets/github-app
              readOnly: true
      volumes:
        - name: git-repo
          emptyDir: {}
        - name: work
          persistentVolumeClaim:
            claimName: product-model-work
        - name: tmp
          emptyDir: {}
        - name: github-app-key
          secret:
            secretName: baloo-github-app
            items:
              - key: private-key
                path: private-key.pem
---
apiVersion: v1
kind: Service
metadata:
  name: product-model-api
  namespace: baloo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-model-api
  ports:
    - name: http
      port: 18810
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-model-api-ingress
  namespace: baloo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: product-model-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw
      ports:
        - protocol: TCP
          port: 18810
