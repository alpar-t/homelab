apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-backup-retry
  namespace: longhorn-system
data:
  backup_retry.py: |
    #!/usr/bin/env python3
    """Retry missed Longhorn recurring backups without rerunning a whole group."""

    import datetime as dt
    import hashlib
    import json
    from pathlib import Path
    import ssl
    import time
    import urllib.error
    import urllib.request


    NAMESPACE = 'longhorn-system'
    API = '/apis/longhorn.io/v1beta2/namespaces/' + NAMESPACE
    JOBS = '/apis/batch/v1/namespaces/' + NAMESPACE + '/jobs'
    RETRY_LABEL = 'monitoring.homepbp.io/backup-retry-run'
    POLICIES = {
        'weekly-backup': ('default', 10 * 86400),
        'critical-daily-backup': ('critical', 48 * 3600),
    }
    FIRST_DELAY = 15 * 60
    SECOND_DELAY = 45 * 60
    RETRY_WINDOW = 6 * 3600
    MAX_ATTEMPTS = 2
    MAX_ACTIVE_VOLUMES = 2


    def timestamp(value):
        if not value:
            return None
        return dt.datetime.fromisoformat(value.replace('Z', '+00:00')).timestamp()


    def retry_name(job_name, volume_name, attempt):
        digest = hashlib.sha256((job_name + '/' + volume_name).encode()).hexdigest()[:20]
        return f'backup-retry-{digest}-{attempt}'


    def job_end(job):
        status = job.get('status', {})
        if status.get('completionTime'):
            return timestamp(status['completionTime'])
        return max((timestamp(c.get('lastTransitionTime')) or 0
                    for c in status.get('conditions', [])
                    if c.get('type') == 'Failed' and c.get('status') == 'True'), default=0)


    def latest_job(jobs, name):
        candidates = [j for j in jobs if any(
            ref.get('kind') == 'CronJob' and ref.get('name') == name
            for ref in j.get('metadata', {}).get('ownerReferences', []))
            and job_end(j)]
        return max(candidates, key=lambda j: timestamp(j['status']['startTime'])) if candidates else None


    def eligible(volume, group, job_name):
        labels = volume.get('metadata', {}).get('labels', {})
        return (labels.get(f'recurring-job-group.longhorn.io/{group}') == 'enabled'
                or labels.get(f'recurring-job.longhorn.io/{job_name}') == 'enabled')


    def backup_volume(backup, snapshots):
        status = backup.get('status', {})
        if status.get('volumeName'):
            return status['volumeName']
        snapshot = snapshots.get(backup.get('spec', {}).get('snapshotName'))
        return snapshot.get('spec', {}).get('volume') if snapshot else None


    def completed_since(backups, snapshots, volume_name, start):
        return any(backup_volume(b, snapshots) == volume_name
                   and b.get('status', {}).get('state') == 'Completed'
                   and (timestamp(b.get('status', {}).get('backupCreatedAt')) or 0) >= start
                   for b in backups)


    def other_backup_running(backups, snapshots, volume_name):
        return any(backup_volume(b, snapshots) == volume_name
                   and b.get('status', {}).get('state') not in ('Completed', 'Error', 'Failed')
                   for b in backups)


    def snapshot_object(name, volume_name, job_name, run_name):
        return {'apiVersion': 'longhorn.io/v1beta2', 'kind': 'Snapshot',
                'metadata': {'name': name, 'namespace': NAMESPACE,
                             'labels': {RETRY_LABEL: run_name, 'longhornvolume': volume_name}},
                'spec': {'volume': volume_name, 'createSnapshot': True,
                         'labels': {'RecurringJob': job_name}}}


    def backup_object(name, snapshot_name, job_name, run_name):
        return {'apiVersion': 'longhorn.io/v1beta2', 'kind': 'Backup',
                'metadata': {'name': name, 'namespace': NAMESPACE,
                             'labels': {RETRY_LABEL: run_name}},
                'spec': {'snapshotName': snapshot_name, 'backupMode': 'incremental',
                         'labels': {'RecurringJob': job_name}}}


    class Kubernetes:
        def __init__(self):
            service_account = Path('/var/run/secrets/kubernetes.io/serviceaccount')
            self.token = service_account / 'token'
            context = ssl.create_default_context(cafile=str(service_account / 'ca.crt'))
            class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self, request, fp, code, msg, headers, newurl):
                    return None

            self.opener = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPSHandler(context=context))
            self.base = 'https://kubernetes.default.svc'

        def request(self, path, body=None):
            data = json.dumps(body).encode() if body is not None else None
            request = urllib.request.Request(self.base + path, data=data, headers={
                'Authorization': 'Bearer ' + self.token.read_text().strip(),
                'Content-Type': 'application/json'}, method='POST' if data else 'GET')
            try:
                with self.opener.open(request, timeout=10) as response:
                    payload = response.read(8 * 1024 * 1024 + 1)
            except urllib.error.HTTPError as error:
                if body is not None and error.code == 409:
                    return None
                raise RuntimeError(f'Kubernetes API {path}: HTTP {error.code}') from None
            if len(payload) > 8 * 1024 * 1024:
                raise RuntimeError('Kubernetes API response exceeds bound')
            return json.loads(payload)


    def reconcile_volume(client, job_name, job, volume, backups, snapshots, now, can_create=True):
        volume_name = volume['metadata']['name']
        start = timestamp(job['status']['startTime'])
        completed = job_end(job)
        if completed_since(backups, snapshots, volume_name, start):
            return 'completed'
        if now < completed + FIRST_DELAY or now > completed + RETRY_WINDOW:
            return 'outside retry window'
        if volume.get('status', {}).get('state') != 'attached' or volume.get('status', {}).get('robustness') != 'healthy':
            return 'volume not attached and healthy'
        for attempt in range(1, MAX_ATTEMPTS + 1):
            name = retry_name(job['metadata']['name'], volume_name, attempt)
            snapshot = snapshots.get(name)
            backup = next((b for b in backups if b['metadata']['name'] == name), None)
            if snapshot is None:
                if attempt > 1 and now < previous_failure + SECOND_DELAY:
                    return 'waiting for retry backoff'
                if not can_create:
                    return 'retry concurrency limit'
                if other_backup_running(backups, snapshots, volume_name):
                    return 'another backup is active'
                client.request(API + '/snapshots', snapshot_object(name, volume_name, job_name, job['metadata']['name']))
                return f'created snapshot attempt {attempt}'
            if backup is None:
                status = snapshot.get('status', {})
                if status.get('error'):
                    previous_failure = timestamp(snapshot['metadata']['creationTimestamp']) or now
                    continue
                if not status.get('readyToUse'):
                    return f'waiting for snapshot attempt {attempt}'
                if not can_create:
                    return 'retry concurrency limit'
                if other_backup_running(backups, snapshots, volume_name):
                    return 'another backup is active'
                client.request(API + '/backups', backup_object(name, name, job_name, job['metadata']['name']))
                return f'created backup attempt {attempt}'
            state = backup.get('status', {}).get('state')
            if state == 'Completed':
                return 'completed'
            if state not in ('Error', 'Failed'):
                return f'waiting for backup attempt {attempt}: {state or "pending"}'
            previous_failure = timestamp(backup['metadata']['creationTimestamp']) or now
        return 'retry attempts exhausted'


    def run(client, now=None):
        now = time.time() if now is None else now
        jobs = client.request(JOBS)['items']
        volumes = client.request(API + '/volumes')['items']
        backups = client.request(API + '/backups')['items']
        snapshots = {s['metadata']['name']: s for s in client.request(API + '/snapshots')['items']}
        backup_by_name = {b['metadata']['name']: b for b in backups}
        active = set()
        for name, snapshot in snapshots.items():
            if RETRY_LABEL not in snapshot.get('metadata', {}).get('labels', {}):
                continue
            if now > (timestamp(snapshot.get('metadata', {}).get('creationTimestamp')) or 0) + RETRY_WINDOW:
                continue
            backup = backup_by_name.get(name)
            if snapshot.get('status', {}).get('error'):
                continue
            if backup is None or backup.get('status', {}).get('state') not in ('Completed', 'Error', 'Failed'):
                active.add(snapshot['spec']['volume'])
        for job_name, (group, alert_age) in POLICIES.items():
            if RETRY_WINDOW >= alert_age:
                raise RuntimeError(f'{job_name}: retry window reaches backup alert age')
            job = latest_job(jobs, job_name)
            if job is None:
                continue
            completed = job_end(job)
            if now > completed + RETRY_WINDOW:
                continue
            for volume in volumes:
                if eligible(volume, group, job_name):
                    volume_name = volume['metadata']['name']
                    can_create = volume_name in active or len(active) < MAX_ACTIVE_VOLUMES
                    result = reconcile_volume(client, job_name, job, volume, backups, snapshots, now,
                                              can_create=can_create)
                    if result.startswith('created'):
                        active.add(volume_name)
                    if result != 'completed':
                        print(f'{job_name} {volume_name}: {result}', flush=True)


    if __name__ == '__main__':
        run(Kubernetes())
