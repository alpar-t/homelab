apiVersion: v1
kind: Namespace
metadata:
  name: newjoy-website-staging
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-environment
  namespace: newjoy-website-staging
data:
  environment.json: |
    {"environment":"staging","showStagingBanner":true,"enableFeaturedProjectSelector":true}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-nginx
  namespace: newjoy-website-staging
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        server_tokens off;
        etag off;
        if_modified_since off;

        add_header Cache-Control "private, no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            try_files $uri $uri/ $uri.html =404;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: newjoy-website-staging
spec:
  selector:
    app.kubernetes.io/name: newjoy-website
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: newjoy-website-staging
spec:
  selector:
    app.kubernetes.io/name: newjoy-website-oauth2-proxy
  ports:
    - {name: http, port: 4180, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: newjoy-website-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: newjoy-website-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newjoy-website-oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
          args:
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --trusted-proxy-ip=10.42.0.0/16
            - --upstream=static://200
            - --provider=oidc
            - --oidc-issuer-url=https://auth.newjoy.ro
            - --skip-oidc-discovery=true
            - --login-url=https://auth.newjoy.ro/authorize
            - --redeem-url=http://pocket-id.pocket-id.svc.cluster.local/api/oidc/token
            - --oidc-jwks-url=http://pocket-id.pocket-id.svc.cluster.local/.well-known/jwks.json
            - --scope=openid profile email groups
            - --oidc-groups-claim=groups
            - --email-domain=*
            - --insecure-oidc-allow-unverified-email=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-name=_newjoy_website_staging
            - --cookie-domain=staging.newjoy.ro
            - --redirect-url=https://staging.newjoy.ro/oauth2/callback
            - --whitelist-domain=staging.newjoy.ro
            - --skip-auth-route=^/ping$
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: newjoy-website-staging-oidc, key: client_id}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: newjoy-website-staging-oidc, key: client_secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: newjoy-website-staging-cookie, key: cookie_secret}
          ports:
            - {name: http, containerPort: 4180}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website-oauth2-proxy
  namespace: newjoy-website-staging
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
spec:
  ingressClassName: nginx
  rules:
    - host: staging.newjoy.ro
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port: {number: 4180}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: newjoy-website-staging
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.newjoy-website-staging.svc.cluster.local:4180/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://staging.newjoy.ro/oauth2/start?rd=https://$host$escaped_request_uri
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
spec:
  ingressClassName: nginx
  rules:
    - host: staging.newjoy.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port: {number: 80}
