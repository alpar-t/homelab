# Render with ./deploy/homelab/render-staging-deployment.sh <tag@sha256:digest>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: newjoy-website-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: newjoy-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newjoy-website
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: ghcr.io/alpar-t/newjoy-website:sha-6ab0fc98768b451edd6ed8de221c80b963c933f9@sha256:1b96f40e7e4e6bec02331b493c211523cfb88d347d6745812659d5944e6684ce
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: environment, mountPath: /usr/share/nginx/html/environment.json, subPath: environment.json, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: nginx-config
          configMap: {name: website-nginx}
        - name: environment
          configMap: {name: website-environment}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
