# Local DNS entries for Kubernetes services
# Format: IP_ADDRESS HOSTNAME
# These are managed via GitOps - edit here, push, ArgoCD syncs
#
# Pi-hole v6 reads FTLCONF_dns_hosts from this ConfigMap.
# Keep the value to host records only: it is passed directly as an environment
# variable to both Pi-hole instances.

apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-custom-dns
  namespace: pihole
data:
  custom.list: |-
    192.168.1.173 pamacs.local pamacs
    192.168.1.174 buksi.local buksi
    192.168.1.166 pufi.local pufi
    192.168.1.200 ha-db.local

