apiVersion: v1
kind: ConfigMap
metadata:
  name: pocket-id-access-check
  namespace: pocket-id
data:
  check.js: |
    async function check() {
      const denied = [];
      let checked = 0;
      for (let page = 1; ; page++) {
        const query = new URLSearchParams({"pagination[limit]": "100", "pagination[page]": String(page)});
        const response = await fetch(`http://pocket-id.pocket-id.svc.cluster.local/api/oidc/clients?${query}`, {
          headers: {"X-API-Key": process.env.POCKET_ID_API_KEY},
          signal: AbortSignal.timeout(30000),
        });
        if (!response.ok) throw new Error(`Pocket ID audit request failed: HTTP ${response.status}`);
        const result = await response.json();
        if (!Array.isArray(result.data) || !result.pagination || !Number.isInteger(result.pagination.totalPages)) {
          throw new Error("Unexpected Pocket ID audit response");
        }
        for (const client of result.data) {
          checked++;
          // The list DTO omits group memberships; inspect each full client DTO.
          const detailResponse = await fetch(`http://pocket-id.pocket-id.svc.cluster.local/api/oidc/clients/${encodeURIComponent(client.id)}`, {
            headers: {"X-API-Key": process.env.POCKET_ID_API_KEY},
            signal: AbortSignal.timeout(30000),
          });
          if (!detailResponse.ok) throw new Error(`Pocket ID client audit failed: HTTP ${detailResponse.status}`);
          const detail = await detailResponse.json();
          if (detail.isGroupRestricted !== true || !Array.isArray(detail.allowedUserGroups) || !detail.allowedUserGroups.length) {
            denied.push(`${client.name} (${client.id})`);
          }
        }
        if (page >= result.pagination.totalPages) break;
      }
      if (!checked) throw new Error("Pocket ID audit returned no clients");
      if (denied.length) throw new Error(`Clients without explicit group restrictions: ${denied.join(", ")}`);
      console.log(`All ${checked} Pocket ID clients require explicit access groups`);
    }
    check().catch(error => {
      // Log the audit result only; never log responses, headers, or credentials.
      console.error(error.message);
      process.exitCode = 1;
    });
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pocket-id-access-check
  namespace: pocket-id
spec:
  schedule: "0 6 * * *"
  timeZone: Europe/Bucharest
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pocket-id-access-check
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: ghcr.io/openclaw/openclaw:2026.6.11@sha256:3814fb1f62f9cfc5944de088c5817c68c88b5d721feebe36420b666a90a61ce7
              command: ["node", "/scripts/check.js"]
              env:
                - name: POCKET_ID_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: pocket-id-api-key
                      key: api_key
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: pocket-id-access-check
