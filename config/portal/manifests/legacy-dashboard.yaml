# Adopt the old dashboard ingress and send all requests to the protected portal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forecastle
  namespace: forecastle
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: https://portal.newjoy.ro/
    nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.newjoy.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forecastle
                port:
                  name: http
