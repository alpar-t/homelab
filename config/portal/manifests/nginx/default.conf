# These headers are supplied by ingress-nginx only after oauth2-proxy validates
# the session. Never expose the portal Service directly outside the cluster.
map $http_x_auth_request_groups $portal_role {
    default                                          base;
    "~*(^|[ ,])advanced_apps([ ,]|$)"               admin;
    "~*(^|[ ,])family_users([ ,]|$)"                family;
}

# Only advanced_apps can select another catalog. For every other role the
# query parameter is ignored, so ?view=admin cannot elevate portal visibility.
map "$portal_role:$arg_view" $portal_catalog {
    default                                          catalog/base.json;
    "admin:family"                                  catalog/family.json;
    "admin:baloo"                                   catalog/baloo.json;
    "admin:base"                                    catalog/base.json;
    ~^admin:                                         catalog/admin.json;
    ~^family:                                        catalog/family.json;
    ~^base:                                          catalog/base.json;
}

map $http_x_auth_request_preferred_username $portal_user {
    default  $http_x_auth_request_preferred_username;
    ""       $http_x_auth_request_email;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' https://auth.newjoy.ro; img-src 'self' data:; object-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The browser can request only this stable URL. nginx resolves it to a
    # server-selected catalog using the verified group claim.
    location = /catalog.json {
        add_header Cache-Control "private, no-store" always;
        try_files /$portal_catalog =404;
    }

    # Internal redirects from /catalog.json are allowed; direct requests are not.
    location ^~ /catalog/ {
        internal;
        add_header Cache-Control "private, no-store" always;
    }

    location = /whoami {
        default_type text/plain;
        add_header Cache-Control "private, no-store" always;
        return 200 "$portal_user\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
