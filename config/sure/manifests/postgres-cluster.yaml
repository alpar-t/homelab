apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sure-db
  namespace: sure
  labels:
    app.kubernetes.io/name: sure
    data-criticality: critical
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 2
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16@sha256:51e1f280076dd6eafd4e2ccc16edbeb8cb62c9b2623e79ed0609965151e79bd6

  bootstrap:
    initdb:
      database: sure
      owner: sure

  storage:
    size: 5Gi
    storageClass: longhorn-ssd

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      # Leave room for barman backup processes.
      memory: 1Gi

  backup:
    barmanObjectStore:
      destinationPath: "s3://homelab-longhorn-backup/cnpg/sure-db"
      endpointURL: "https://s3.eu-central-003.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
    retentionPolicy: "30d"

  postgresql:
    parameters:
      log_statement: "ddl"
      shared_buffers: "128MB"
      max_connections: "50"
      archive_mode: "on"
      archive_timeout: "1h"
      max_slot_wal_keep_size: "1GB"
