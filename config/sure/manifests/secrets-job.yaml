# Generate Sure's application, Active Record encryption, and Redis secrets
# inside the cluster. Values never enter Git, and an existing Secret is kept.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sure-secrets
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sure-secrets
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sure-secrets
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sure-secrets
subjects:
  - kind: ServiceAccount
    name: sure-secrets
    namespace: sure
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sure-secrets
  namespace: sure
  labels:
    app.kubernetes.io/name: sure
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: sure-secrets
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: docker.io/bitnami/kubectl:latest@sha256:c62a62db80e777acdee87f76bc6f06a95239ad2ff210bf78f585e39e33da98e2
          command: ["/bin/sh", "-c"]
          env:
            - name: HOME
              value: /tmp
          args:
            - |
              set -eu

              if kubectl get secret sure-secrets -n sure >/dev/null 2>&1; then
                echo "sure-secrets already exists, nothing to do"
                exit 0
              fi

              random_value() {
                head -c "$1" /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c "$1"
              }

              SECRET_KEY_BASE=$(random_value 128)
              PRIMARY_KEY=$(random_value 32)
              DETERMINISTIC_KEY=$(random_value 32)
              DERIVATION_SALT=$(random_value 32)
              REDIS_PASSWORD=$(random_value 48)
              REDIS_URL="redis://default:${REDIS_PASSWORD}@sure-redis.sure.svc.cluster.local:6379/0"

              kubectl create secret generic sure-secrets \
                --namespace=sure \
                --from-literal=SECRET_KEY_BASE="$SECRET_KEY_BASE" \
                --from-literal=ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY="$PRIMARY_KEY" \
                --from-literal=ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY="$DETERMINISTIC_KEY" \
                --from-literal=ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT="$DERIVATION_SALT" \
                --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
                --from-literal=REDIS_URL="$REDIS_URL"

              echo "sure-secrets created"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
