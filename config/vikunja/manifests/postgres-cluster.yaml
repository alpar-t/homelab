# Vikunja's task database. Two instances provide automatic failover; continuous
# WAL archiving and daily base backups provide point-in-time recovery in B2.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vikunja-db
  namespace: vikunja
  labels:
    app.kubernetes.io/name: vikunja
    data-criticality: critical
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 2
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-202608030910-standard-bookworm@sha256:eaf7f17fb4004f3c9e18b0cfd9a6b0257b3adc0d610b4593165603b173fb1426

  bootstrap:
    initdb:
      database: vikunja
      owner: vikunja

  storage:
    size: 5Gi
    storageClass: longhorn-ssd

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  backup:
    barmanObjectStore:
      destinationPath: "s3://homelab-longhorn-backup/cnpg/vikunja-db"
      endpointURL: "https://s3.eu-central-003.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
    retentionPolicy: "30d"

  postgresql:
    parameters:
      log_statement: "ddl"
      shared_buffers: "128MB"
      max_connections: "50"
      archive_mode: "on"
      archive_timeout: "1h"
      max_slot_wal_keep_size: "1GB"
