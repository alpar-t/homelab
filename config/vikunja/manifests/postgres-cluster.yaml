# Vikunja's task database. Two instances provide automatic failover; continuous
# WAL archiving and daily base backups provide point-in-time recovery in B2.
# Native barmanObjectStore requires the deprecated system image because it
# contains barman-cloud binaries. Migrate this cluster to the Barman Cloud
# plugin before CNPG 1.31 removes native support.
#
# Bootstrap the namespace-local credential copy with renamed CNPG keys:
#   kubectl create secret generic cnpg-backup-credentials -n vikunja \
#     --from-literal=ACCESS_KEY_ID="$(kubectl get secret backblaze-backup-credentials -n longhorn-system -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)" \
#     --from-literal=SECRET_ACCESS_KEY="$(kubectl get secret backblaze-backup-credentials -n longhorn-system -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vikunja-db
  namespace: vikunja
  labels:
    app.kubernetes.io/name: vikunja
    data-criticality: critical
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 2
  enablePDB: false

  # Local storage relies on CNPG replication for HA. Never place both database
  # instances on the same node.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-202608030910-system-bookworm@sha256:8561d04754c2caf8ed203b52e96163a24ff045782ca726d01b01bbcb0649222c

  bootstrap:
    initdb:
      database: vikunja
      owner: vikunja

  storage:
    size: 5Gi
    storageClass: local-ssd
    # Rancher local-path volumes cannot be expanded in place. Replace one CNPG
    # instance/PVC at a time if this allocation must grow.
    resizeInUseVolumes: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  backup:
    barmanObjectStore:
      destinationPath: "s3://homelab-longhorn-backup/cnpg/vikunja-db"
      endpointURL: "https://s3.eu-central-003.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
    retentionPolicy: "30d"

  postgresql:
    parameters:
      log_statement: "ddl"
      shared_buffers: "128MB"
      max_connections: "50"
      archive_mode: "on"
      archive_timeout: "1h"
      max_slot_wal_keep_size: "1GB"
