# Generate Vikunja's persistent signing secret inside the cluster. Keeping this
# value stable across restarts preserves browser sessions and API credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vikunja-secrets
  namespace: vikunja
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vikunja-secrets
  namespace: vikunja
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vikunja-secrets
  namespace: vikunja
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vikunja-secrets
subjects:
  - kind: ServiceAccount
    name: vikunja-secrets
    namespace: vikunja
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vikunja-secrets
  namespace: vikunja
  labels:
    app.kubernetes.io/name: vikunja
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: vikunja-secrets
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: docker.io/bitnami/kubectl:latest@sha256:c62a62db80e777acdee87f76bc6f06a95239ad2ff210bf78f585e39e33da98e2
          command: ["/bin/sh", "-c"]
          env:
            - name: HOME
              value: /tmp
          args:
            - |
              set -eu

              if kubectl get secret vikunja-secrets -n vikunja >/dev/null 2>&1; then
                echo "vikunja-secrets already exists, nothing to do"
                exit 0
              fi

              SERVICE_SECRET=$(head -c 96 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 96)
              kubectl create secret generic vikunja-secrets \
                --namespace=vikunja \
                --from-literal=service_secret="$SERVICE_SECRET"

              echo "vikunja-secrets created"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
