apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector
  namespace: zabbix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zabbix-collector-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, daemonsets]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [longhorn.io]
    resources: [volumes, replicas, backups, backuptargets]
    verbs: [get, list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, scheduledbackups]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zabbix-collector-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zabbix-collector-readonly
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: zabbix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zabbix-storage-events
  namespace: node-config
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zabbix-storage-events
  namespace: node-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zabbix-storage-events
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: zabbix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zabbix-mail-logs
  namespace: stalwart-mail
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zabbix-mail-logs
  namespace: stalwart-mail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zabbix-mail-logs
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: zabbix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zabbix-otmonitor-logs
  namespace: otmonitor
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zabbix-otmonitor-logs
  namespace: otmonitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zabbix-otmonitor-logs
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: zabbix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: zabbix
  annotations:
    configmap.reloader.stakater.com/reload: collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      serviceAccountName: collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: docker.io/python:3.13.12-alpine@sha256:bb1f2fdb1065c85468775c9d680dcd344f6442a2d1181ef7916b60a623f11d40
          command: [python, -B, /config/collector.py]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: functional-credentials
              mountPath: /credentials
              readOnly: true
            - name: arrival-state
              mountPath: /state
      volumes:
        - name: config
          configMap:
            name: collector
        - name: functional-credentials
          secret:
            secretName: zabbix-functional-credentials
            optional: true
            # Project only native-enforced read-only credentials and public TLS trust.
            # Legacy browser/HA/arr/file/financial/admin keys must never be mounted.
            items:
              - key: immich-api-key
                path: immich-api-key
              - key: vikunja_read_token
                path: vikunja_read_token
              - key: tandoor_read_token
                path: tandoor_read_token
              - key: stalwart_mail_ca
                path: stalwart_mail_ca
        - name: arrival-state
          persistentVolumeClaim:
            claimName: collector-arrival-state
---
# Replaceable, timestamp-only history. Rebuild from retained Stalwart logs if
# lost; the storage class excludes this cache from recurring off-site backups.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: collector-arrival-state
  namespace: zabbix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-ssd-noreplica
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: zabbix
spec:
  selector:
    app: collector
  ports:
    - name: http
      port: 80
      targetPort: http
