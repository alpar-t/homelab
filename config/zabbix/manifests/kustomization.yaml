apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - wireguard-monitoring-rbac.yaml
  - namespace.yaml
  - postgres.yaml
  - deployment.yaml
  - collector.yaml
  - network-policy.yaml
  - oidc-client.yaml
  - oauth2-proxy.yaml
  - ingress.yaml
configMapGenerator:
  - name: collector
    namespace: zabbix
    files:
      - assets/collector.py
      - assets/functional.py
      - assets/service_wireguard.py
      - assets/service_wireguard.json
      - assets/service_platform_controllers.py
      - assets/service_platform_controllers.json
      - assets/mail_activity.py
      - assets/policy.json
generatorOptions:
  disableNameSuffixHash: true
