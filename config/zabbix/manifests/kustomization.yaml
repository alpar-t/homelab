apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - deployment.yaml
  - collector.yaml
  - network-policy.yaml
configMapGenerator:
  - name: collector
    namespace: zabbix
    files:
      - assets/collector.py
      - assets/policy.json
generatorOptions:
  disableNameSuffixHash: true
