apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-monitoring
  namespace: zabbix
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zabbix
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: baloo
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zabbix
      ports:
        - port: 5432
          protocol: TCP
    # CNPG's operator/webhook health traffic; database TCP stays namespace-local.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
---
# Permit public ingress only to the frontend, never to collector snapshots.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
  namespace: zabbix
spec:
  podSelector:
    matchLabels:
      app: zabbix
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentication-ingress
  namespace: zabbix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/part-of: zabbix
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 4180
          protocol: TCP

---
# HTTP items and a compromised frontend must not reach unrelated private APIs.
# Both Zabbix containers share this pod; localhost server traffic stays local.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zabbix-server-egress
  namespace: zabbix
spec:
  podSelector:
    matchLabels:
      app: zabbix
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: collector
      ports:
        # NetworkPolicies match the target pod port after Service80 translation.
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: zabbix-db
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: baloo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw
      ports:
        # The separately scoped hook token authorizes /hooks/zabbix only.
        - port: 18789
          protocol: TCP
