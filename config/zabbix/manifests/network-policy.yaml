apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-monitoring
  namespace: zabbix
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zabbix
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: baloo
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zabbix
      ports:
        - port: 5432
          protocol: TCP
    # CNPG's operator/webhook health traffic; database TCP stays namespace-local.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
