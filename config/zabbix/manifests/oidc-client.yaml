# Create the Pocket ID client and write zabbix-oidc into the zabbix namespace.
# The shared provisioner keeps the client secret and cookie key out of Git.
apiVersion: batch/v1
kind: Job
metadata:
  name: zabbix-oidc-client
  namespace: pocket-id
  labels:
    app.kubernetes.io/name: zabbix
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: oidc-provisioner
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: ghcr.io/openclaw/openclaw:2026.9.7@sha256:0da12cd49983fcb5e4915fd3135ce7a33d82f93649b1df6964946d2c1d1dbcfc
          command: ["/bin/sh", "-c", "/bin/sh /scripts/provision.sh >/dev/null && echo OIDC-credentials-ready"]
          env:
            - name: APP_NAME
              value: zabbix
            - name: APP_URL
              value: https://monitor.newjoy.ro
            - name: CALLBACK_URL
              value: https://monitor.newjoy.ro/oauth2/callback
            - name: TARGET_NS
              value: zabbix
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: oidc-provisioner-script
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
---
# oauth2-proxy needs a separate stable encryption key. Generate it independently
# of the shared OIDC provisioner so a first zabbix sync cannot race a provisioner
# update in the Pocket ID application.
apiVersion: batch/v1
kind: Job
metadata:
  name: zabbix-cookie-secret
  namespace: pocket-id
  labels:
    app.kubernetes.io/name: zabbix
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: oidc-provisioner
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: ghcr.io/openclaw/openclaw:2026.9.7@sha256:0da12cd49983fcb5e4915fd3135ce7a33d82f93649b1df6964946d2c1d1dbcfc
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              K8S_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              K8S_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              K8S_API=https://kubernetes.default.svc
              SECRET_URL=$K8S_API/api/v1/namespaces/zabbix/secrets/zabbix-cookie

              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --cacert "$K8S_CA" \
                -H "Authorization: Bearer $K8S_TOKEN" \
                "$SECRET_URL")
              if [ "$STATUS" = "200" ]; then
                echo "zabbix-cookie already exists, nothing to do"
                exit 0
              fi

              if [ "$STATUS" != "404" ]; then
                echo "Secret lookup failed: HTTP $STATUS" >&2
                exit 1
              fi

              COOKIE_SECRET=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
              curl -sf -o /dev/null -X POST \
                --cacert "$K8S_CA" \
                -H "Authorization: Bearer $K8S_TOKEN" \
                -H "Content-Type: application/json" \
                "$K8S_API/api/v1/namespaces/zabbix/secrets" \
                -d "{
                  \"apiVersion\": \"v1\",
                  \"kind\": \"Secret\",
                  \"metadata\": {\"name\": \"zabbix-cookie\", \"namespace\": \"zabbix\"},
                  \"type\": \"Opaque\",
                  \"stringData\": {\"cookie_secret\": \"$COOKIE_SECRET\"}
                }"
              echo "zabbix-cookie created"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
