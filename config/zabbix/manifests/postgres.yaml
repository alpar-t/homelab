apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zabbix-db
  namespace: zabbix
  labels:
    data-criticality: critical
spec:
  instances: 2
  enablePDB: true
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-trixie@sha256:ae22bdd6008e02c18180c84192b3afbc95a758a184899f1cb7e85ed9c3ef8128
  bootstrap:
    initdb:
      database: zabbix
      owner: zabbix
  storage:
    size: 10Gi
    storageClass: local-ssd
    resizeInUseVolumes: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "60"
      archive_timeout: 1h
      max_slot_wal_keep_size: 1GB
  # Matches the currently deployed CNPG backup backend. Migrate with the other
  # databases before CNPG 1.31; see migrate-cnpg-to-barman-cloud-plugin.md.
  backup:
    barmanObjectStore:
      destinationPath: s3://homelab-longhorn-backup/cnpg/zabbix-db
      endpointURL: https://s3.eu-central-003.backblazeb2.com
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zabbix-db-daily
  namespace: zabbix
spec:
  schedule: "0 45 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: zabbix-db
