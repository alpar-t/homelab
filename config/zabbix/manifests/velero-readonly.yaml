apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zabbix-velero-readonly
  namespace: velero
rules:
  - apiGroups: [velero.io]
    resources: [backupstoragelocations, schedules, backups]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zabbix-velero-readonly
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zabbix-velero-readonly
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: zabbix
