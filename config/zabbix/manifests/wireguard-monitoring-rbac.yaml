apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zabbix-wireguard-metadata
  namespace: wireguard
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [wireguard-home]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zabbix-wireguard-metadata
  namespace: wireguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zabbix-wireguard-metadata
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: zabbix
